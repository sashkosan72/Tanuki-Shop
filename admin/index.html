
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Адмін-панель — Tanuki Shop</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8f5;color:#29232a;font-family:Arial,sans-serif;line-height:1.5}
button,input,select{font:inherit}
.wrap{width:min(1050px,calc(100% - 28px));margin:30px auto}
.panel,.order{background:white;border:1px solid #f0dfe5;border-radius:18px;padding:20px;box-shadow:0 8px 25px #46233210}
.login{max-width:420px;margin:12vh auto}
.brand{font-size:24px;font-weight:800}
.muted{color:#756b74}
.field{display:grid;gap:7px;margin:18px 0}
input{width:100%;padding:12px;border:1px solid #e8d7df;border-radius:10px}
button{border:0;border-radius:10px;padding:11px 16px;background:#ff6f91;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#f5e8ed;color:#46343d}
.hidden{display:none!important}
.error{color:#b42345}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.stat{background:white;border:1px solid #f0dfe5;border-radius:14px;padding:14px 18px;min-width:145px}
.stat strong{display:block;font-size:24px}
.orders{display:grid;gap:14px}
.order-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.order h3{margin:0 0 5px}
.details{color:#756b74;font-size:14px;margin:12px 0}
.items{padding-left:20px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
select{padding:10px;border:1px solid #e8d7df;border-radius:9px;background:white}
.empty{text-align:center;padding:35px;color:#756b74}
@media(max-width:550px){.top{align-items:flex-start;flex-direction:column}.panel,.order{padding:15px}}
</style>
</head>
<body>
<main class="wrap">

<section id="loginPanel" class="panel login">
  <div class="brand">🦝 Tanuki Shop</div>
  <h1>Вхід адміністратора</h1>
  <p class="muted">Увійдіть, щоб керувати замовленнями.</p>
  <form id="loginForm">
    <label class="field">
      Пароль адміністратора
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <button id="loginButton" type="submit">Увійти</button>
    <p id="loginError" class="error" role="alert"></p>
  </form>
</section>

<section id="dashboard" class="hidden">
  <header class="top">
    <div>
      <div class="brand">🦝 Tanuki Shop</div>
      <div class="muted">Панель керування замовленнями</div>
    </div>
    <div>
      <button id="refreshButton" class="secondary" type="button">Оновити</button>
      <button id="logoutButton" type="button">Вийти</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat">Усього замовлень<strong id="orderCount">0</strong></div>
    <div class="stat">Нові<strong id="newCount">0</strong></div>
    <div class="stat">Сума<strong id="totalAmount">0 ₴</strong></div>
  </div>

  <div id="orders" class="orders">
    <div class="panel empty">Завантаження…</div>
  </div>
  <p id="dashboardError" class="error"></p>
</section>
</main>

<script>
"use strict";

const loginPanel=document.getElementById("loginPanel");
const dashboard=document.getElementById("dashboard");
const loginForm=document.getElementById("loginForm");
const loginButton=document.getElementById("loginButton");
const loginError=document.getElementById("loginError");
const ordersBox=document.getElementById("orders");
const dashboardError=document.getElementById("dashboardError");

const labels={
  new:"Нове",
  confirmed:"Підтверджено",
  shipped:"Відправлено",
  completed:"Завершено",
  cancelled:"Скасовано"
};

const money=n=>new Intl.NumberFormat("uk-UA").format(n)+" ₴";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

async function api(path,options={}){
  const response=await fetch(path,{
    credentials:"same-origin",
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    }
  });

  let data={};
  try{data=await response.json()}catch{}

  if(!response.ok||!data.ok){
    throw new Error(data.error||"Помилка запиту");
  }

  return data;
}

function showLogin(){
  dashboard.classList.add("hidden");
  loginPanel.classList.remove("hidden");
}

function showDashboard(){
  loginPanel.classList.add("hidden");
  dashboard.classList.remove("hidden");
  loadOrders();
}

async function loadOrders(){
  dashboardError.textContent="";
  ordersBox.innerHTML='<div class="panel empty">Завантаження…</div>';

  try{
    const data=await api("/api/admin/orders");
    const orders=data.orders||[];

    document.getElementById("orderCount").textContent=orders.length;
    document.getElementById("newCount").textContent=
      orders.filter(o=>o.status==="new").length;

    document.getElementById("totalAmount").textContent=
      money(orders.reduce((s,o)=>s+Number(o.total_amount||0),0));

    if(!orders.length){
      ordersBox.innerHTML='<div class="panel empty">Замовлень поки немає 🦝</div>';
      return;
    }

    ordersBox.innerHTML=orders.map(o=>{
      const itemRows=(o.items||[]).map(i=>
        "<li>"+esc(i.product_name)+" × "+Number(i.quantity)+
        " — "+money(Number(i.price)*Number(i.quantity))+"</li>"
      ).join("");

      const options=Object.entries(labels).map(([value,label])=>
        '<option value="'+value+'" '+(o.status===value?"selected":"")+
        '>'+label+'</option>'
      ).join("");

      return `
        <article class="order">
          <div class="order-head">
            <div>
              <h3>${esc(o.order_number)}</h3>
              <span class="muted">${esc(o.created_at)}</span>
            </div>
            <strong>${money(Number(o.total_amount))}</strong>
          </div>

          <div class="details">
            👤 ${esc(o.customer_name)} · 📞 ${esc(o.customer_phone)}<br>
            📍 ${esc(o.customer_city)}, ${esc(o.customer_address)}
            ${o.customer_comment?"<br>💬 "+esc(o.customer_comment):""}
          </div>

          <strong>Товари:</strong>
          <ul class="items">${itemRows}</ul>

          <div class="actions">
            <label>
              Статус:
              <select data-status-id="${Number(o.id)}">${options}</select>
            </label>
            <button type="button" data-save-id="${Number(o.id)}">
              Зберегти статус
            </button>
          </div>
        </article>
      `;
    }).join("");

  }catch(error){
    if(error.message.includes("вхід")||
       error.message.includes("адміністратора")){
      showLogin();
      return;
    }

    dashboardError.textContent=error.message;
    ordersBox.innerHTML='<div class="panel empty">Не вдалося завантажити замовлення.</div>';
  }
}

loginForm.addEventListener("submit",async event=>{
  event.preventDefault();
  loginError.textContent="";
  loginButton.disabled=true;
  loginButton.textContent="Перевірка…";

  try{
    await api("/api/admin/login",{
      method:"POST",
      body:JSON.stringify({
        password:document.getElementById("password").value
      })
    });

    document.getElementById("password").value="";
    showDashboard();

  }catch(error){
    loginError.textContent=error.message;
  }finally{
    loginButton.disabled=false;
    loginButton.textContent="Увійти";
  }
});

ordersBox.addEventListener("click",async event=>{
  const button=event.target.closest("[data-save-id]");
  if(!button)return;

  const id=button.dataset.saveId;
  const select=ordersBox.querySelector('[data-status-id="'+id+'"]');

  button.disabled=true;
  button.textContent="Збереження…";

  try{
    await api("/api/admin/orders/"+id+"/status",{
      method:"PATCH",
      body:JSON.stringify({status:select.value})
    });
    await loadOrders();
  }catch(error){
    dashboardError.textContent=error.message;
    button.disabled=false;
    button.textContent="Зберегти статус";
  }
});

document.getElementById("refreshButton")
  .addEventListener("click",loadOrders);

document.getElementById("logoutButton")
  .addEventListener("click",async()=>{
    try{
      await api("/api/admin/logout",{
        method:"POST",
        body:"{}"
      });
    }catch{}
    showLogin();
  });

(async()=>{
  try{
    await api("/api/admin/me");
    showDashboard();
  }catch{
    showLogin();
  }
})();
</script>
</body>
</html>
