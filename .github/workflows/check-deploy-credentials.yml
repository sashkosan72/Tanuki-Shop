name: Tanuki Shop — Secure deploy access check
on:
  push:
    branches: [feature/logo-promocodes-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm deployment credential availability without revealing any values
        run: |
          node --input-type=module <<'NODE'
          const e=process.env;
          const configured=Boolean(e.CLOUDFLARE_API_TOKEN?.trim()||e.CF_API_TOKEN?.trim());
          console.log('Cloudflare deploy credential configured:',configured);
          console.log('Optional account id configured:',Boolean(e.CLOUDFLARE_ACCOUNT_ID));
          console.log('No credentials or customer data are printed.');
          if(!configured){
            console.error('::error::Deployment is blocked: configure CLOUDFLARE_API_TOKEN or CF_API_TOKEN in GitHub Actions secrets. Never paste credentials into logs or source files.');
            process.exitCode=1;
          }
          NODE
      - name: Verify Cloudflare access without changing resources
        env:
          CLOUDFLARE_ACCOUNT_ID: '4bf2830f01c0e935d43f65a06664dda7'
        run: |
          npx wrangler whoami --json > /dev/null
          npx wrangler d1 list --json > /dev/null
