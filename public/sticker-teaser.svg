  <linearGradient id="hair" x1="0" x2="1" y2="1"><stop stop-color="#fff1ff"/><stop offset=".38" stop-color="#d997f5"/><stop offset="1" stop-color="#7757d9"/></linearGradient>
  <linearGradient id="tanuki" x1="0" x2="0" y2="1"><stop stop-color="#efcba7"/><stop offset="1" stop-color="#be846c"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#faadff" stop-opacity=".8"/><stop offset="1" stop-color="#faadff" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  <g id="star"><path d="M0 -16L4 -4L16 0L4 4L0 16L-4 4L-16 0L-4 -4Z" fill="#ffe2fd"/></g>
  <g id="sakura"><g fill="#ffaadd" stroke="#ffffff" stroke-width="2"><ellipse cy="-12" rx="10" ry="17"/><ellipse cy="-12" rx="10" ry="17" transform="rotate(72)"/><ellipse cy="-12" rx="10" ry="17" transform="rotate(144)"/><ellipse cy="-12" rx="10" ry="17" transform="rotate(216)"/><ellipse cy="-12" rx="10" ry="17" transform="rotate(288)"/></g><circle r="6" fill="#ffdf77"/></g>
</defs>
