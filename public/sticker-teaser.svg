<svg xmlns="http://www.w3.org/2000/svg" width="820" height="680" viewBox="0 0 820 680" role="img" aria-labelledby="title desc">
<title id="title">Tanuki Shop — майбутні аніме-стікери</title>
<desc id="desc">Авторська ілюстрація: милі стікери з танукі, аніме-дівчиною, квітами сакури та зірками на фіолетовому тлі.</desc>
<defs>
